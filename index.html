<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>3dp sewing machine</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.3.1/p5.js"></script>
  <script src="p5.fab.sewing.js" type="text/javascript"></script>
  <script src="https://unpkg.com/p5-webserial@0.1.1/build/p5.webserial.js"></script>
</head>



<body>

  <div id="container">
    <div class="ui-frame" id="messages">
      <h1>Messages <span onclick="clearMsg()"><u>clear</u></span></h1>
      <div id="message-container">
      </div>
    </div>

    <div class="ui-frame" id="main-controller">
      <h1>Main Controller</h1>

      <div class="ui-group">
        <div class="ui-item">
          <div class="btn" id="connect-btn" onclick="_fab.serial.requestPort()">connect to printer</div>
        </div>
      </div>

      <div class="ui-group">
        <div class="ui-item">
          <div class="btn" id="start-btn" onclick="">initialize printer</div>
        </div>
        <div class="ui-item">
          <div class="btn" id="stop-btn" onclick="">stop printing</div>
        </div>
      </div>

      <div class="ui-group">
        <div class="ui-item">
          <span class="label">Nozzle Temp</span> <input type="number" min="0" step="1" value="200" id="nozzle-temp">
        </div>
        <div class="ui-item">
          <span class="label">Bed Temp</span> <input type="number" min="0" step="1" value="60" id="bed-temp">
        </div>
      </div>

      <div class="ui-group">
        <div class="ui-item">
          <div class="btn" id="heat-btn" onclick="">heat nozzle/bed</div>
        </div>
        <div class="ui-item">
          <div class="btn" id="cool-btn" onclick="">cool nozzle/bed</div>
        </div>
      </div>

      <div class="ui-group">
        <div class="ui-item">
          <span class="label">Fan Speed (0&ndash;255)</span> <input type="number" min="0" step="1" value="255"
            id="fan-speed">
        </div>
        <div class="ui-item">
          <span class="label">fan on</span>
          <input type="checkbox" id="fan-on">
        </div>
      </div>
    </div>
      <div class="ui-group">
        <div class="ui-item">
          <span class="label">enable cold extrusion</span>
          <input type="checkbox" id="cold-extrusion">
        </div>
      </div>
    
<div id="variable-controller">
<input id="amplitude-input" placeholder="A, amplitude, mm (0-80)"> 
<input id="wavelength-input" placeholder="wavelength, mm (0-150)"> 
<input id="midline-input" placeholder="D, midline, mm (0)"> 
<button id="axes-btn"> Draw Axes </button>
<button id="reset-btn"> Reset </button>
<button id="drawgraph-btn"> Draw Graph </button>
<button id="penup"> Lift Pen Up</button>
<button id="pendown"> Bring Pen Down</button>

<div id="trig-controller">
<label for="trigtype">Choose a function:</label>

<select name="trigtype" id="trigtype">
  <option value="sine">Sine</option>
  <option value="cosine">Cosine</option>
  <option value="tangent">Tangent</option>
</select>
    </div>
</div>


  <script type="text/javascript" src="script.js?v=4"></script>
</body>

</html>
